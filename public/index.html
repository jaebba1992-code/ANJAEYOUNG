<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험 대본 생성기</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #21262e;
    --border: #2c323b;
    --border-strong: #3a4149;
    --text: #edeef0;
    --text-2: #a3aab3;
    --text-muted: #6b7278;
    --accent: #e8a33d;
    --accent-dim: #6b5427;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .eyebrow { font-size: 13px; color: var(--accent); letter-spacing: 0.08em; margin: 0 0 6px; font-weight: 500; }
  h1 { font-size: 26px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); font-size: 14px; margin: 0 0 32px; line-height: 1.6; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 200px; }
  label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent-dim); }
  .segmented { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg-btn { flex: 1; background: transparent; border: none; color: var(--text-2); padding: 8px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .seg-btn.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
  button.generate {
    width: 100%; background: var(--accent); color: #1a1204; border: none; border-radius: 8px;
    padding: 13px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 4px;
  }
  button.generate:disabled { opacity: 0.5; cursor: default; }
  button.generate:not(:disabled):hover { filter: brightness(1.06); }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .result-head span { font-size: 13px; color: var(--text-2); }
  .copy-btn { background: transparent; border: 1px solid var(--border-strong); color: var(--text-2); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .copy-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .script-body { white-space: pre-wrap; line-height: 1.85; font-size: 15px; color: var(--text); min-height: 60px; }
  .error-box { background: #2a1a1a; border: 1px solid #4a2a2a; color: #e0a3a3; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.6; }
  .footnote { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 24px; line-height: 1.6; }
  .footnote a { color: var(--text-2); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">INSURANCE SCRIPT LAB</p>
  <h1>보험 콘텐츠 대본 생성기</h1>
  <p class="sub">주제와 출처자료를 입력하면 롱폼(유튜브) 또는 숏폼(릴스/쇼츠) 대본을 자동으로 만들어드려요.</p>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>형식</label>
        <div class="segmented" id="formatSeg">
          <button type="button" class="seg-btn active" data-val="short">숏폼 (30~60초)</button>
          <button type="button" class="seg-btn" data-val="long">롱폼 상세 (1만자↑)</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>주제 / 상품</label>
        <input type="text" id="topic" placeholder="예: 어린이보험 갱신형 vs 비갱신형 차이">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>타겟 고객 (선택)</label>
        <input type="text" id="target" placeholder="예: 30대 초보 부모">
      </div>
      <div class="field">
        <label>톤</label>
        <select id="tone">
          <option value="친근하고 공감형">친근하고 공감형</option>
          <option value="전문적이고 신뢰감 있는">전문적이고 신뢰감 있는</option>
          <option value="긴장감 있고 후킹 강한">긴장감 있고 후킹 강한</option>
        </select>
      </div>
    </div>

    <div class="row" id="sourceRow" style="display:none;">
      <div class="field">
        <label>출처자료 (근거로 삼을 자료를 붙여넣으세요)</label>
        <textarea id="source" rows="6" placeholder="약관, 통계, 기사, 유튜브 자막 등 근거 자료 원문을 붙여넣으면 이 내용을 인용해서 작성합니다."></textarea>
      </div>
    </div>

    <button class="generate" id="genBtn">대본 생성하기</button>
    <div id="progressWrap" style="display:none; margin-top:12px;">
      <div style="height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden;">
        <div id="progressBar" style="height:100%; width:0%; background:var(--accent); transition:width .3s;"></div>
      </div>
      <p id="progressText" style="font-size:12px; color:var(--text-2); margin:8px 0 0; text-align:center;"></p>
    </div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <div class="result-head">
      <span id="resultLabel">생성된 대본</span>
      <button class="copy-btn" id="copyBtn">복사</button>
    </div>
    <div id="resultBody"></div>
  </div>

  <p class="footnote">서버 상태가 궁금하면 <a href="/api/health" target="_blank">/api/health</a> 를 확인해보세요.</p>
</div>

<script>
let format = 'short';

document.querySelectorAll('#formatSeg .seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#formatSeg .seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    format = btn.dataset.val;
    document.getElementById('sourceRow').style.display = format === 'long' ? 'flex' : 'none';
  });
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('resultBody').innerText;
  navigator.clipboard.writeText(text);
  const btn = document.getElementById('copyBtn');
  const old = btn.textContent;
  btn.textContent = '복사됨';
  setTimeout(() => btn.textContent = old, 1200);
});

document.getElementById('genBtn').addEventListener('click', generateScript);

async function callClaude(system, messages, retries = 3) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system, messages })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ('오류 ' + response.status));
      return data.text || '';
    } catch (err) {
      lastErr = err;
      if (attempt < retries) {
        await new Promise(r => setTimeout(r, 1200 * (attempt + 1)));
        continue;
      }
    }
  }
  throw lastErr;
}

async function generateScript() {
  const topic = document.getElementById('topic').value.trim();
  const target = document.getElementById('target').value.trim();
  const tone = document.getElementById('tone').value;
  const source = document.getElementById('source').value.trim();
  const genBtn = document.getElementById('genBtn');
  const resultPanel = document.getElementById('resultPanel');
  const resultBody = document.getElementById('resultBody');
  const resultLabel = document.getElementById('resultLabel');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');

  if (!topic) { alert('주제를 입력해주세요.'); return; }

  genBtn.disabled = true;
  genBtn.textContent = '생성 중...';
  resultPanel.style.display = 'block';
  resultBody.innerHTML = '';
  const scriptDiv = document.createElement('div');
  scriptDiv.className = 'script-body';
  resultBody.appendChild(scriptDiv);

  const baseSystem = `당신은 한국 보험 영업/마케팅 콘텐츠 전문 대본 작가입니다.
다음 스타일 원칙을 지킵니다:
- 시청자가 스스로 판단하고 행동하게 만드는 자연스러운 화법을 씁니다.
- 민감한 정보를 물을 때는 이유를 먼저 설명하는 신뢰 형성 화법을 사용합니다.
- 추천 전에 짧은 예고를 던져 자연스러운 흐름을 만듭니다.
- 전문 용어는 쉬운 비유로 풀어서 설명합니다.
- 과장 광고나 확인되지 않은 사실은 포함하지 않고, 제공된 출처자료에 없는 수치는 지어내지 않습니다.
- 실제 사람이 카메라 앞에서 말하듯 구어체로 작성합니다.
- 결과는 대본 본문만 출력합니다.`;

  const sourceBlock = source ? `\n\n[출처자료 — 이 내용을 근거로 구체적으로 설명하세요]\n${source}` : '';

  try {
    if (format === 'short') {
      resultBody.innerHTML = '<div class="script-body">생성 중...</div>';
      resultLabel.textContent = '숏폼 대본 (30~60초)';
      const system = baseSystem + `\n- 30~60초 숏폼 대본. 3초 안에 시선을 잡는 강한 훅으로 시작, 핵심 정보 1~2개, 명확한 CTA로 마무리. 분량 200~350자.` + sourceBlock;
      const userPrompt = `주제: ${topic}\n${target ? '타겟 고객: ' + target : ''}\n톤앤매너: ${tone}\n\n위 조건에 맞는 숏폼 대본을 작성해줘.`;
      const script = await callClaude(system, [{ role: 'user', content: userPrompt }]);
      resultBody.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'script-body';
      div.textContent = script || '대본을 받아오지 못했어요. 다시 시도해주세요.';
      resultBody.appendChild(div);
    } else {
      resultLabel.textContent = '롱폼 상세 대본 (목표 1만자 이상)';
      resultBody.innerHTML = '';
      resultBody.appendChild(scriptDiv);
      progressWrap.style.display = 'block';

      const TARGET_CHARS = 10500;
      const MAX_CHUNKS = 18;
      let fullScript = '';
      let chunkIndex = 0;

      const longSystem = baseSystem + `\n- 최종 1만자 이상, 요약하지 말고 근거자료를 인용하며 상세히 설명하세요.
- 지금은 전체 대본 중 한 부분만 이어서 씁니다. 이전 내용을 반복하지 말고 자연스럽게 이어주세요.
- 이번 청크는 하나의 완결된 단락으로 마무리하세요.` + sourceBlock;

      while (fullScript.length < TARGET_CHARS && chunkIndex < MAX_CHUNKS) {
        chunkIndex++;
        progressText.textContent = `작성 중... (${fullScript.length.toLocaleString()}자 / 목표 ${TARGET_CHARS.toLocaleString()}자, ${chunkIndex}번째 구간)`;
        progressBar.style.width = Math.min(100, Math.round((fullScript.length / TARGET_CHARS) * 100)) + '%';

        let stagePrompt;
        if (chunkIndex === 1) {
          stagePrompt = `주제: ${topic}\n${target ? '타겟 고객: ' + target : ''}\n톤앤매너: ${tone}\n\n상세 롱폼 대본의 도입부(강한 훅 + 문제 제기)를 써줘. 본론은 아직.`;
        } else if (fullScript.length < TARGET_CHARS * 0.85) {
          stagePrompt = `주제: ${topic}\n${target ? '타겟 고객: ' + target : ''}\n톤앤매너: ${tone}\n\n마지막 부분:\n"""\n${fullScript.slice(-900)}\n"""\n\n자연스럽게 이어서 본론을 더 상세히 계속 써줘. 아직 마무리하지 말고.`;
        } else {
          stagePrompt = `주제: ${topic}\n${target ? '타겟 고객: ' + target : ''}\n톤앤매너: ${tone}\n\n마지막 부분:\n"""\n${fullScript.slice(-900)}\n"""\n\n요약 정리하고 CTA로 마무리해줘.`;
        }

        let chunk;
        try {
          chunk = await callClaude(longSystem, [{ role: 'user', content: stagePrompt }]);
        } catch (chunkErr) {
          progressText.textContent = `${chunkIndex}번째 구간 오류 — ${fullScript.length.toLocaleString()}자는 남아있어요.`;
          const errDiv = document.createElement('div');
          errDiv.className = 'error-box';
          errDiv.style.marginTop = '14px';
          errDiv.textContent = '오류: ' + chunkErr.message;
          resultBody.appendChild(errDiv);
          break;
        }
        if (!chunk) break;
        fullScript += (fullScript ? '\n\n' : '') + chunk.trim();
        scriptDiv.textContent = fullScript;

        if (chunkIndex > 2 && fullScript.length >= TARGET_CHARS * 0.85 &&
            /(문의|상담|신청|연락|가입).{0,15}(주세요|드립니다|바랍니다)?\s*$/.test(chunk.trim().slice(-60))) {
          break;
        }
        await new Promise(r => setTimeout(r, 300));
      }

      progressText.textContent = `완료 — 총 ${fullScript.length.toLocaleString()}자`;
      progressBar.style.width = '100%';
    }
  } catch (err) {
    resultBody.innerHTML = '<div class="error-box">오류가 발생했어요: ' + err.message + '</div>';
  } finally {
    genBtn.disabled = false;
    genBtn.textContent = '대본 생성하기';
  }
}
</script>
</body>
</html>
